[project]
name = "spec-ptc"
version = "0.1.0"
description = "Speculative programmatic tool calling for CodeAct/RLM-style harnesses"
requires-python = ">=3.12"
dependencies = [
    "textual>=1.0",
    "openai>=1.50",
    "rich>=13.0",
    "datasets>=5.0.1",
    "huggingface-hub>=1.28.0",
    "seaborn>=0.13.2",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
]

[dependency-groups]
dev = [
    "rlms>=0.1",  # only example.py / demo/rlm.py / their tests touch it
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.3",
    "ruff>=0.16.4",
]

[project.scripts]
spec-ptc-daemon = "spec_ptc.daemon:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

# On disk the package is src/; installed / imported as spec_ptc (PyPI-ready).
[tool.setuptools]
package-dir = { spec_ptc = "src" }
packages = [
    "spec_ptc",
    "spec_ptc.contracts",
    "spec_ptc.engine",
    "spec_ptc.runtime",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 120

[tool.uv.workspace]
members = [
    "third_party/rlm",
]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["spec_ptc", "demo", "benchmark", "plugins"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B023", "E731", "F841"]
