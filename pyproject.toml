[project]
name = "spec-ptc"
version = "0.1.0"
description = "Speculative programmatic tool calling for CodeAct/RLM-style harnesses"
requires-python = ">=3.12"
dependencies = [
    "textual>=1.0",
    "rlms>=0.1",
    "openai>=1.50",
    "rich>=13.0",
    "datasets>=5.0.1",
    "huggingface-hub>=1.28.0",
    "seaborn>=0.13.2",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.3",
    "ruff>=0.16.4",
]

[project.scripts]
spec-ptc-daemon = "spec_ptc.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spec_ptc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 120

[tool.uv.workspace]
members = [
    "third_party/rlm",
]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B023", "E731", "F841"]
