<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Speculation Cache</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
  /* spec-ptc demo palette. Single theme by design.
     LAYOUT RULE: every region is fixed-size; nothing ever moves or reflows. */
  :root {
    --bg: #0b0f14;
    --panel: #11161d;
    --panel-2: #0e1319;
    --line: #2a313a;
    --text: #e8edf3;
    --raw: #c9d1d9;
    --dim: #77808c;
    --faint: #4d5661;
    --spec: #c39bff;
    --run: #6cb0ff;
    --ok: #46c364;
    --amber: #d29922;
    --kw: #ff7b72;
    --str: #a5d6ff;
    --tool: #d2a8ff;
    --com: #6e7681;
    --num: #79c0ff;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --row: 26px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--sans);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px 20px;
  }

  /* ------------------------------------------------------------ frame */
  .stage { width: 1240px; max-width: 100%; position: relative; }
  .window {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
    height: 596px;                                   /* fixed frame */
    display: flex; flex-direction: column; overflow: hidden;
  }
  .titlebar {
    height: 42px; flex: none; display: flex; align-items: center;
    padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel);
    position: relative;
  }
  .dots { display: flex; gap: 8px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .dots i:nth-child(1) { background: #ff5f57; }
  .dots i:nth-child(2) { background: #febc2e; }
  .dots i:nth-child(3) { background: #28c840; }
  .titlebar .name {
    position: absolute; left: 0; right: 0; text-align: center;
    font: 500 13px/1 var(--mono); color: var(--dim); letter-spacing: .03em;
    pointer-events: none;
  }

  .phasebar { height: 46px; flex: none; display: flex; align-items: center; padding: 0 20px; }
  .chip {
    width: 330px; flex: none; height: 28px;
    font: 600 12px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase;
    padding: 0 13px; border-radius: 999px; border: 1px solid var(--line);
    color: var(--dim); display: inline-flex; align-items: center; gap: 8px;
    transition: color .3s, border-color .3s, background .3s;
    white-space: nowrap; overflow: hidden;
  }
  .chip .dot { width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--faint); transition: background .3s; }
  .chip.gen  { color: var(--run);   border-color: color-mix(in srgb, var(--run) 45%, transparent);   background: color-mix(in srgb, var(--run) 9%, transparent); }
  .chip.gen .dot  { background: var(--run);   animation: pulse 1.1s ease-in-out infinite; }
  .chip.exec { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 45%, transparent); background: color-mix(in srgb, var(--amber) 9%, transparent); }
  .chip.exec .dot { background: var(--amber); animation: pulse .8s ease-in-out infinite; }
  .chip.done { color: var(--ok);    border-color: color-mix(in srgb, var(--ok) 45%, transparent);    background: color-mix(in srgb, var(--ok) 10%, transparent); }
  .chip.done .dot { background: var(--ok); }
  @keyframes pulse { 50% { opacity: .35; } }
  .clock { margin-left: auto; font: 500 14px/1 var(--mono); color: var(--dim);
    font-variant-numeric: tabular-nums; width: 78px; text-align: right; }

  /* ------------------------------------------------------------ content */
  .content {
    flex: none; height: 412px;
    display: grid; grid-template-columns: 640px minmax(0, 1fr); gap: 16px;
    padding: 0 20px; align-items: start;
  }
  .content > div { min-width: 0; }

  /* left: one raw stream box — thinking and code share it, same size */
  .streambox {
    height: 412px; overflow: hidden;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 0 0; position: relative;
    font: 400 15px/var(--row) var(--mono);
  }
  .boxlabel {
    height: 30px; padding: 0 16px;
    font: 600 11px/26px var(--sans); letter-spacing: .12em; text-transform: uppercase;
    color: var(--dim); white-space: nowrap; overflow: hidden;
  }
  .boxlabel .sub { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--faint); }
  .rw { height: var(--row); display: flex; padding-right: 14px; overflow: hidden; }
  .rw .ln { width: 44px; flex: none; text-align: right; padding-right: 14px;
    color: var(--faint); font-size: 12.5px; line-height: var(--row); user-select: none;
    opacity: 0; transition: opacity .4s; }
  .rw .src { white-space: pre; overflow: hidden; flex: 1; color: var(--raw); }
  .rw.think-row .src { color: var(--raw); }
  .rw.linted.think-row .src { color: var(--dim); font-style: italic; }
  .rw.linted.fence-row .src { color: var(--faint); }
  .rw.linted .src { color: var(--text); }
  .rw.active { background: color-mix(in srgb, var(--ok) 9%, transparent);
    box-shadow: inset 3px 0 0 var(--ok); }
  .rw.active.busy { background: color-mix(in srgb, var(--amber) 9%, transparent);
    box-shadow: inset 3px 0 0 var(--amber); }
  .cursor { display: inline-block; width: 8px; background: var(--run); height: 1.05em;
    vertical-align: text-bottom; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .t-kw { color: var(--kw); } .t-str { color: var(--str); } .t-tool { color: var(--tool); font-weight: 600; }
  .t-com { color: var(--com); } .t-num { color: var(--num); } .t-fn { color: var(--run); }

  .turnnote { height: 26px; padding: 0 16px 0 44px; margin-top: 4px;
    font: italic 400 13px/26px var(--sans); color: var(--faint);
    opacity: 0; transition: opacity .6s; }

  /* right: the cache is a box; cards live inside it */
  .cachebox {
    height: 412px; overflow: hidden;
    background: var(--panel); border: 1px solid color-mix(in srgb, var(--spec) 32%, var(--line));
    border-radius: 10px; padding: 10px 12px 0;
    display: flex; flex-direction: column; gap: 9px;
  }
  .cachebox .boxlabel { color: var(--spec); padding: 0 4px; flex: none; }
  .card {
    height: 64px; flex: none; overflow: hidden;
    background: var(--panel-2); border: 1px solid var(--line);
    border-left: 3px solid var(--spec); border-radius: 8px;
    padding: 8px 12px 0;
    visibility: hidden; opacity: 0;
    transition: opacity .45s, border-color .4s;      /* fade in place only */
  }
  .card.show { visibility: visible; opacity: 1; }
  .card.hit { border-left-color: var(--ok);
    background: color-mix(in srgb, var(--ok) 11%, var(--panel-2));
    border-color: color-mix(in srgb, var(--ok) 35%, var(--line)); }
  .card .head { display: flex; align-items: baseline; gap: 9px; height: 22px; overflow: hidden; }
  .card .tool { font: 600 13.5px/1.5 var(--mono); color: var(--tool); flex: none; }
  .card .args { font: 400 12.5px/1.6 var(--mono); color: var(--dim); flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .status { flex: none; width: 150px; text-align: right;
    font: 500 12px/1.6 var(--mono); color: var(--spec); white-space: nowrap; overflow: hidden; }
  .card.cached .status { color: var(--ok); }
  .card.hit .status { color: var(--ok); font-weight: 600; }
  .card .out { font: 400 12.5px/1.7 var(--mono); color: var(--run); height: 22px; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card.cached .out, .card.hit .out { color: var(--dim); }
  .card .out .pfx { color: var(--faint); }

  /* answer: reserved slot, fades in */
  .answerwrap { flex: none; height: 78px; padding: 14px 20px 0; }
  .answer {
    height: 62px; overflow: hidden;
    visibility: hidden;
    border: 1px solid color-mix(in srgb, var(--ok) 45%, transparent);
    background: color-mix(in srgb, var(--ok) 7%, transparent);
    border-radius: 10px; padding: 10px 16px;
    font: 500 14px/1.55 var(--mono); color: var(--text);
    opacity: 0; transition: opacity .6s;
  }
  .answer.show { visibility: visible; opacity: 1; }
  .answer .big { color: var(--ok); font-weight: 600; }
  .answer .dim2 { color: var(--dim); font-size: 12.5px; display: block; margin-top: 2px; }

  svg.arrows { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  svg.arrows path.aline { fill: none; stroke-width: 2; stroke-linecap: round; }

  .controls {
    width: 1240px; max-width: 100%;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 6px 0; font: 500 13px/1 var(--sans); color: var(--dim);
  }
  .controls button {
    font: 600 12.5px/1 var(--sans); letter-spacing: .04em;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 7px;
    padding: 8px 14px; cursor: pointer;
  }
  .controls button:hover { border-color: var(--dim); }
  .controls button:focus-visible { outline: 2px solid var(--run); outline-offset: 2px; }
  .controls .speeds { display: flex; gap: 6px; }
  .controls .speeds button.on { border-color: var(--run); color: var(--run); }
  .controls .hint { margin-left: auto; color: var(--faint); }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="window">
    <div class="titlebar">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="name">spec-ptc · speculative tool calls</div>
    </div>
    <div class="phasebar">
      <span class="chip" id="phase"><span class="dot"></span><span id="phaseText">idle</span></span>
    </div>
    <div class="content">
      <div>
        <div class="streambox" id="stream">
          <div class="boxlabel">main context <span class="sub" id="streamsub">— raw model output</span></div>
        </div>
      </div>
      <div>
        <div class="cachebox" id="cachebox">
          <div class="boxlabel">speculation cache <span class="sub">— fills during generation</span></div>
        </div>
      </div>
    </div>
    <div class="answerwrap"><div class="answer" id="answer"></div></div>
  </div>
  <svg class="arrows" id="arrows"></svg>
</div>

<div class="controls">
  <button id="replay">⟳ replay</button>
  <span class="speeds" id="speeds">
    <button data-s="0.75">0.75×</button><button data-s="1" class="on">1×</button><button data-s="1.5">1.5×</button><button data-s="2">2×</button>
  </span>
  <span class="hint">R replay · space pause · loops automatically</span>
</div>

<script>
"use strict";
/* ------------------------------------------------------------------ script
   One raw stream: <think>…</think> then a fenced repl block, all one size.
   kind: think | fence | code (code rows get numbers + lint colors). */

const ROWS = [
  { kind: "think", toks: [["<think>"]] },
  { kind: "think", toks: [["I need to chunk up this context into pieces"]] },
  { kind: "think", toks: [["and digest them with sub-agents."]] },
  { kind: "think", toks: [["</think>"]] },
  { kind: "fence", toks: [["```repl"]] },
  { kind: "code", toks: [["plan"], [" = "], ["llm_query", "t-tool"], ["("], ['"Suggest a plan to digest this finance data"', "t-str"], [")"]] },
  { kind: "code", toks: [["stats"], [" = "], ["summary_stats", "t-fn"], ["("], ["context"], [")"], ["  "], ["# not hooked, skip speculation", "t-com"]] },
  { kind: "code", toks: [["txns"], [" = "], ["chunks", "t-fn"], ["("], ["context"], [", "], ["4", "t-num"], [")"]] },
  { kind: "code", toks: [["parts"], [" = []"]] },
  { kind: "code", toks: [["for", "t-kw"], [" q "], ["in", "t-kw"], [" txns:"]] },
  { kind: "code", toks: [["    parts.append("], ["llm_query", "t-tool"], ["("], ['"Digest "', "t-str"], [" + q.label + q.text))"]] },
  { kind: "code", toks: [["answer"], [" = plan + "], ['"\\n"', "t-str"], [".join(parts)"]] },
  { kind: "fence", toks: [["```"]] },
];
const rawText = (i) => ROWS[i].toks.map((s) => s[0]).join("");
const PLAN_ROW = 5, STATS_ROW = 6, CHUNK_ROW = 7, PARTS_ROW = 8, FOR_ROW = 9, LOOP_ROW = 10, ANSWER_ROW = 11;

const CARDS = [
  { args: '"Suggest a plan to digest this finance data"',
    out: "Split by quarter; per chunk report revenue, burn, anomalies; merge.", specMs: 2000 },
  { args: '"Digest Q1: 3,214 txns…"',
    out: "Q1: revenue $4.2M (+12%). Cloud spend spike in March — one-off.", specMs: 2800 },
  { args: '"Digest Q2: 3,977 txns…"',
    out: "Q2: revenue $4.6M (+9%). Burn flat; $80k FX loss on EUR contracts.", specMs: 2800 },
  { args: '"Digest Q3: 4,405 txns…"',
    out: "Q3: revenue $5.1M (+11%). Duplicate vendor payout $23k — flagged.", specMs: 2800 },
  { args: '"Digest Q4: 4,880 txns…"',
    out: "Q4: revenue $5.8M (+14%). Hiring costs up; runway 19 months.", specMs: 2800 },
];

/* ------------------------------------------------------------------ engine */
const $ = (id) => document.getElementById(id);
const state = { speed: 1, paused: false, run: 0, clockOn: false, demoMs: 0 };
if (matchMedia("(prefers-reduced-motion: reduce)").matches) state.speed = 3;

class Cancelled extends Error {}
async function sleep(ms) {
  const myRun = state.run;
  let left = ms;
  while (left > 0) {
    await new Promise((r) => setTimeout(r, 16));
    if (state.run !== myRun) throw new Cancelled();
    if (!state.paused) left -= 16 * state.speed;
  }
}

setInterval(() => {  // demo-time still accumulates for the closing estimate
  if (state.clockOn && !state.paused) state.demoMs += 100 * state.speed;
}, 100);

function setPhase(cls, text) {
  const chip = $("phase");
  chip.className = "chip" + (cls ? " " + cls : "");
  $("phaseText").textContent = text;
}
function getCSS(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

/* fixed-geometry arrows: stream box right edge at the row midline → card left edge */
function drawArrow(rowIdx, cardIdx, color) {
  const stage = $("stage").getBoundingClientRect();
  const box = $("stream").getBoundingClientRect();
  const row = rowEls[rowIdx].getBoundingClientRect();
  const card = cardEls[cardIdx].getBoundingClientRect();
  const x1 = box.right - stage.left + 3, y1 = row.top - stage.top + row.height / 2;
  const x2 = card.left - stage.left - 8, y2 = card.top - stage.top + card.height / 2;
  const mx = x1 + (x2 - x1) * 0.55;
  const svg = $("arrows");
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  // stop the line just short of the card so the head tip touches its edge
  p.setAttribute("d", `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2 - 7} ${y2}`);
  p.setAttribute("class", "aline");
  p.setAttribute("stroke", color);
  const head = document.createElementNS("http://www.w3.org/2000/svg", "path");
  head.setAttribute("d", `M ${x2 + 1} ${y2} l -9 -4.5 v 9 z`);  // filled triangle
  head.style.fill = color;   // inline style: nothing can override it
  head.style.stroke = "none";
  svg.appendChild(p); svg.appendChild(head);
  const len = p.getTotalLength();
  p.style.strokeDasharray = len;
  p.style.strokeDashoffset = len;
  p.style.transition = `stroke-dashoffset ${0.35 / state.speed}s ease`;
  head.style.opacity = "0";
  head.style.transition = `opacity .15s ease ${0.28 / state.speed}s`;
  requestAnimationFrame(() => { p.style.strokeDashoffset = "0"; head.style.opacity = "1"; });
  // arrows are gestures, not furniture: hold briefly, then vanish entirely
  setTimeout(() => {
    p.style.transition = "opacity .45s"; head.style.transition = "opacity .45s";
    p.style.opacity = "0"; head.style.opacity = "0";
    setTimeout(() => { p.remove(); head.remove(); }, 500);
  }, 1300 / state.speed);
}

/* ------------------------------------------------------------------ build */
let rowEls = [], cardEls = [];
let codeNo = 0;

function buildStatic() {
  $("arrows").innerHTML = "";
  const box = $("stream");
  box.querySelectorAll(".rw, .turnnote").forEach((e) => e.remove());
  codeNo = 0;
  rowEls = ROWS.map((r) => {
    const row = document.createElement("div");
    row.className = "rw " + r.kind + "-row";
    const n = r.kind === "code" ? ++codeNo : "";
    row.innerHTML = `<span class="ln">${n}</span><span class="src"></span>`;
    box.appendChild(row);
    return row;
  });
  const note = document.createElement("div");
  note.className = "turnnote"; note.id = "turnnote";
  note.textContent = "harness finished turn.";
  note.style.opacity = "0";
  box.appendChild(note);
  const cb = $("cachebox");
  cb.querySelectorAll(".card").forEach((e) => e.remove());
  cardEls = CARDS.map((c) => {
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `<div class="head"><span class="tool">llm_query</span><span class="args"></span>
      <span class="status"></span></div><div class="out"><span class="pfx">╰─▸ </span><span class="txt"></span></div>`;
    el.querySelector(".args").textContent = c.args;
    cb.appendChild(el);
    return el;
  });
  const ans = $("answer");
  ans.className = "answer";
  ans.innerHTML = "";
  $("streamsub").textContent = "— raw model output";
  state.demoMs = 0; state.clockOn = false;
  setPhase("", "idle");
}

/* raw token stream: chunks of chars per tick so fast rates aren't capped
   by timer granularity */
async function typeRaw(i, cps) {
  const src = rowEls[i].querySelector(".src");
  const cur = document.createElement("span");
  cur.className = "cursor";
  src.appendChild(cur);
  const text = rawText(i);
  const span = document.createElement("span");
  src.insertBefore(span, cur);
  const step = Math.max(1, Math.round(cps / 55));
  for (let n = 0; n < text.length; n += step) {
    span.textContent = text.slice(0, n + step);
    await sleep((1000 / cps) * step);
  }
  span.textContent = text;
  cur.remove();
}

/* REPL-ify: swap every raw row for its linted tokens, instantly */
function lintNow() {
  for (let i = 0; i < ROWS.length; i++) {
    const row = rowEls[i];
    const src = row.querySelector(".src");
    src.textContent = "";
    for (const [text, cls] of ROWS[i].toks) {
      const span = document.createElement("span");
      if (cls) span.className = cls;
      span.textContent = text;
      src.appendChild(span);
    }
    row.classList.add("linted");
    if (ROWS[i].kind === "code") row.querySelector(".ln").style.opacity = "1";
  }
}

async function speculate(idx, fromRow) {
  const card = cardEls[idx];
  card.classList.add("show");
  card.querySelector(".status").textContent = "⠿ speculating…";
  drawArrow(fromRow, idx, getCSS("--spec"));
  const spin = "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏";
  const txt = card.querySelector(".out .txt");
  const t0 = Date.now();
  const full = CARDS[idx].out;
  const per = CARDS[idx].specMs / full.length;
  for (let n = 0; n < full.length; n += 2) {
    txt.textContent = full.slice(0, n + 2);
    if (!card.classList.contains("hit")) {
      card.querySelector(".status").textContent =
        spin[Math.floor((Date.now() - t0) / 90) % 10] + " speculating…";
    }
    await sleep(per * 2);
  }
  txt.textContent = full;
  card.classList.add("cached");
  if (!card.classList.contains("hit")) {
    card.querySelector(".status").textContent =
      `✓ cached · ${(CARDS[idx].specMs / 1000).toFixed(1)}s`;
  }
}

function cacheHit(idx, fromRow) {
  const card = cardEls[idx];
  card.classList.add("hit");
  card.querySelector(".status").textContent = "✚ cache hit · 0.0s";
  drawArrow(fromRow, idx, getCSS("--ok"));
}

function highlight(rowIdx) {
  rowEls.forEach((el, j) => el.classList.toggle("active", j === rowIdx));
}

/* ------------------------------------------------------------------ scenario */
async function scenario() {
  buildStatic();
  await sleep(650);

  // 1 · one raw stream: thinking, then the fenced repl block
  $("streamsub").textContent = "— raw model output";
  setPhase("gen", "generating — raw tokens");
  state.clockOn = true;
  const bg = [];
  await typeRaw(0, 160);
  await typeRaw(1, 130);
  await typeRaw(2, 130);
  await typeRaw(3, 160);
  await typeRaw(4, 180);
  await typeRaw(PLAN_ROW, 130);
  bg.push(speculate(0, PLAN_ROW).catch(() => {}));     // plan call parsed
  await typeRaw(STATS_ROW, 140);
  await typeRaw(CHUNK_ROW, 150);
  await typeRaw(PARTS_ROW, 150);
  await typeRaw(FOR_ROW, 140);
  await typeRaw(LOOP_ROW, 140);                        // loop call parsed →
  for (let k = 1; k <= 4; k++) {                       // batch: the 4 chunk calls
    bg.push(speculate(k, LOOP_ROW).catch(() => {}));   // start & finish together
  }
  await typeRaw(ANSWER_ROW, 140);
  await typeRaw(12, 180);

  // 2 · generation done — the harness finishes the turn and lints the
  // block INSTANTLY; speculation keeps streaming in the background
  $("turnnote").style.opacity = "1";
  $("streamsub").textContent = "— repl · linted";
  lintNow();
  setPhase("exec", "generation done — executing repl");
  await sleep(550);

  // 3 · the interpreter walks the block; calls resolve from the cache
  highlight(PLAN_ROW); await sleep(130);
  cacheHit(0, PLAN_ROW); await sleep(260);

  highlight(STATS_ROW);                                 // local compute: real wait
  const statsRow = rowEls[STATS_ROW];
  const statsLn = statsRow.querySelector(".ln");
  statsRow.classList.add("busy");
  statsLn.style.color = getCSS("--amber");
  const spin2 = "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏";
  for (let t = 0; t <= 0.9 + 1e-9; t += 0.1) {
    statsLn.textContent = spin2[Math.round(t * 10) % 10];
    $("phaseText").textContent = `executing — summary_stats · ${t.toFixed(1)}s`;
    await sleep(100);
  }
  statsLn.textContent = "2";
  statsLn.style.color = "";
  statsRow.classList.remove("busy");
  $("phaseText").textContent = "executing repl";
  await sleep(90);

  highlight(CHUNK_ROW); await sleep(120);
  highlight(PARTS_ROW); await sleep(110);
  for (let k = 1; k <= 4; k++) {
    highlight(FOR_ROW); await sleep(70);
    highlight(LOOP_ROW); await sleep(90);
    cacheHit(k, LOOP_ROW); await sleep(160);
  }

  highlight(ANSWER_ROW); await sleep(300);
  await Promise.all(bg);                                // ensure cache settled

  // 4 · answer
  setPhase("done", "answered");
  state.clockOn = false;
  const ans = $("answer");
  ans.innerHTML =
    `<span class="big">✓ answer assembled</span> — plan + 4 digests, ` +
    `<span class="big">5/5 sub-calls served from the speculation cache</span>` +
    `<span class="dim2">runtime waited 0.0s on sub-LLM calls — they ran during generation · ` +
    `without speculation ≈ ${(state.demoMs / 1000 + 13.2).toFixed(0)}s end-to-end</span>`;
  ans.classList.add("show");
  rowEls.forEach((el) => el.classList.remove("active"));
  await sleep(4200);
}

async function loopForever() {
  const myRun = ++state.run;
  while (state.run === myRun) {
    try { await scenario(); } catch (e) { if (e instanceof Cancelled) return; throw e; }
  }
}

/* ------------------------------------------------------------------ controls */
$("replay").addEventListener("click", loopForever);
document.addEventListener("keydown", (e) => {
  if (e.key === "r" || e.key === "R") loopForever();
  if (e.key === " ") { state.paused = !state.paused; e.preventDefault(); }
});
$("speeds").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  state.speed = parseFloat(b.dataset.s);
  document.querySelectorAll("#speeds button").forEach((x) => x.classList.toggle("on", x === b));
});
const urlSpeed = new URLSearchParams(location.search).get("speed");
if (urlSpeed) state.speed = parseFloat(urlSpeed) || 1;

loopForever();
</script>
